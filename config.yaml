# ---------------------------------------------------------------------------
# TOPICS — main relevance signal.
#   weight:  how much a hit counts. Title hit = 3 x weight; each distinct
#            abstract hit = 1 x weight (capped at 3 per topic).
#   query:   phrases sent to Europe PMC (title/abstract search).
#   patterns: regexes used to tag and score every paper.
# ---------------------------------------------------------------------------
topics:
  auditory:
    label: "Auditory processing"
    color: "#2f6fb0"
    weight: 1.5
    query: ["auditory", "acoustic", "hearing", "sound", "pitch perception", "speech perception", "music perception", "inferior colliculus", "medial geniculate", "tonotopic"]
    patterns:
      - '\baudit(ory|ion)\b'
      - '\bhearing\b'
      - '\bsounds?\b'
      - '\bacoustic'
      - '\bcochlea'
      - 'inferior colliculus'
      - 'medial geniculate'
      - "heschl"
      - 'superior temporal (gyrus|plane|sulcus)'
      - '\b(para)?belt\b'
      - 'tonotop'
      - '\bpitch\b'
      - '\btimbre\b'
      - '\bspeech\b'
      - '\bsyllabl'
      - '\bprosod'
      - '\blisten(er|ers|ing)\b'
      - '(envelope|cortical|neural) tracking'
      - '\bmusic(al)?\b'
      - '\bmelod(y|ies|ic)\b'
      - '\brhythm(s|ic)?\b'
      - 'pure[- ]tones?|\btones\b|tone (sequence|burst|pip)s?'
  predictive_coding:
    label: "Predictive coding"
    color: "#b5452f"
    weight: 1.6
    query: ["predictive coding", "predictive processing", "prediction error", "mismatch negativity", "oddball", "stimulus-specific adaptation", "repetition suppression", "expectation suppression", "sensory prediction"]
    patterns:
      - 'predictive (coding|processing|routing)'
      - 'prediction errors?'
      - 'mismatch (negativity|response)'
      - '\bMMN\b'
      - 'oddball'
      - '\bdeviants?\b'
      - 'stimulus[- ]specific adaptation'
      - '\bSSA\b'
      - 'repetition (suppression|enhancement)'
      - 'expectation suppression'
      - '\bsurpris(e|al)\b'
      - 'sensory predictions?'
      - 'free[- ]energy'
      - '\bprecision[- ]weight'
  local_global:
    label: "Local–global"
    color: "#7a3e9d"
    weight: 2.2
    query: ["local-global", "local global paradigm", "global deviant", "hierarchical regularities", "nested regularities"]
    patterns:
      - 'local[- –/]global'
      - 'global (deviant|effect|regularit|violation|mismatch)'
      - 'local (deviant|regularit|violation)'
      - '(hierarchical|nested) (auditory )?(regularit|rules?|predictions?)'
      - '\b(xxxxy|aaaab|xxxxx|aaaaa)\b'
  clas:
    label: "Closed-loop auditory stim."
    color: "#1f8a7a"
    weight: 2.2
    query: ["closed-loop auditory stimulation", "closed-loop acoustic stimulation", "phase-locked auditory stimulation", "auditory stimulation during sleep", "acoustic stimulation sleep"]
    patterns:
      - 'closed[- ]loop (auditory|acoustic|sound)'
      - '(auditory|acoustic|sound) (closed[- ]loop|stimulation)'
      - '\bCLAS\b'
      - 'phase[- ](locked|targeted|dependent) (auditory|acoustic|sound) stimul'
      - 'closed[- ]loop stimulation'
      - 'slow[- ](oscillation|wave)s? (enhancement|stimulation)'
  optogenetics:
    label: "Optogenetics"
    color: "#3a8f3a"
    weight: 1.2
    query: ["optogenetic", "optogenetics", "channelrhodopsin", "photostimulation", "photoinhibition"]
    patterns:
      - 'optogenetic'
      - 'channelrhodopsin'
      - '\bChR2\b'
      - '\bChRmine\b'
      - '\bhalorhodopsin|\bNpHR\b'
      - 'archaerhodopsin|\bArchT\b'
      - '\bGtACR'
      - '\bJaws\b'
      - 'photo(stimulat|inhibit|activat)'
  chemogenetics:
    label: "Chemogenetics"
    color: "#a36b12"
    weight: 1.4
    query: ["chemogenetic", "chemogenetics", "DREADD", "DREADDs", "deschloroclozapine", "clozapine-N-oxide"]
    patterns:
      - 'chemogenetic'
      - '\bDREADDs?\b'
      - '\bhM[34]D[qi]\b'
      - 'clozapine[- ]n[- ]oxide|\bCNO\b'
      - 'deschloroclozapine|\bDCZ\b'
      - '\bPSAM|\bPSEM'
      - '\bKORD\b'
  memory:
    label: "Memory"
    color: "#5a5f9e"
    weight: 0.7
    query: ["working memory", "short-term memory", "episodic memory", "recognition memory", "memory consolidation", "memory encoding", "memory retrieval"]
    patterns:
      - '\bmemor(y|ies)\b'
      - '\bmnemonic'
      - '\bengrams?\b'
      - '\b(recall|recollection)\b'
      - 'delayed[- ]match'
      - 'consolidation'
  auditory_memory:
    label: "Auditory memory"
    color: "#245e8f"
    weight: 2.2
    query: ["auditory working memory", "auditory memory", "auditory short-term memory", "echoic memory", "auditory sensory memory", "tonal memory", "auditory recognition memory"]
    patterns:
      - 'auditory (working |short[- ]term |sensory |recognition |long[- ]term )?memor'
      - 'echoic memor'
      - '(tonal|pitch|tone|melodic|sound) memor'
      - 'memor(y|ies) for (sounds?|tones?|melod|pitch)'
      - 'auditory (delayed|match[- ]to[- ]sample)'
  sequences:
    label: "Sequences"
    color: "#c2410c"
    weight: 1.3
    query: ["sequence learning", "sequence processing", "statistical learning", "serial order", "sequential structure", "temporal order", "chunking"]
    patterns:
      - '(?<!RNA )(?<!DNA )(?<!-seq )\bsequences?\b(?![- ]?(ing|d|ncing))'
      - '\bsequential(ly)?\b'
      - 'serial order'
      - 'statistical learning'
      - '\bchunking\b'
      - 'temporal order'
      - 'ordinal'
      - 'transitional probabilit'
  dependencies:
    label: "(Non-)adjacent dependencies"
    color: "#8a2d6b"
    weight: 2.2
    query: ["non-adjacent dependencies", "nonadjacent dependencies", "adjacent dependencies", "artificial grammar", "long-distance dependencies", "phrase structure grammar"]
    patterns:
      - '(non[- ]?)?adjacent dependenc'
      - '\bnon-?adjacent\b'
      - 'long[- ]distance dependenc'
      - 'artificial grammar'
      - '\bAGL\b'
      - '(finite[- ]state|phrase[- ]structure|recursive|center[- ]embedded) (grammar|structure)'
      - '\bsyntactic\b|\bsyntax\b'
      - 'grammatical'
  vocalisations:
    label: "Vocalisations"
    color: "#0f766e"
    weight: 1.6
    query: ["vocalization", "vocalisation", "vocalizations", "vocal communication", "vocal learning", "birdsong", "ultrasonic vocalizations", "conspecific calls"]
    patterns:
      - 'vocali[sz]ation'
      - 'vocal (production|communication|learning|behaviou?r|control|turn[- ]taking|exchange)'
      - '(contact|alarm|social|conspecific|monkey|marmoset|phee|twitter|coo|trill|food) calls?\b'
      - '\bphee\b'
      - '\bbird ?song|\bsongbirds?\b|zebra finch'
      - 'ultrasonic vocali|\bUSVs?\b'
      - 'speech production'
      - '\bconspecific'

# ---------------------------------------------------------------------------
# SPECIES — multiply the score. Highest-matching species wins.
# ---------------------------------------------------------------------------
species:
  macaque:
    label: "Macaque"
    mult: 2.0
    patterns: ['\bmacaques?\b', '\brhesus\b', '\bmacaca\b', '\bmulatta\b', '\bfascicularis\b']
  marmoset:
    label: "Marmoset"
    mult: 2.0
    patterns: ['\bmarmosets?\b', '\bcallithrix\b', '\bjacchus\b']
  other_nhp:
    label: "Other primate"
    mult: 1.6
    patterns: ['\bmonkeys?\b', 'non-?human primates?', '\bNHPs?\b', '\bchimpanzees?\b', '\bbaboons?\b', '\btitis?\b monkey', '\bsquirrel monkey']
  human:
    label: "Human"
    mult: 1.25
    patterns: ['(?<!non-)(?<!non )\bhumans?\b', '\bparticipants\b', '\bpatients\b', '\bvolunteers\b', '\blisteners\b', '\binfants?\b', '\bneonates?\b', '\bchildren\b', '\badults\b']
  rodent:
    label: "Rodent"
    mult: 1.15
    patterns: ['\bmice\b', '\bmouse\b', '\bmurine\b', '\brats?\b', '\brodents?\b', '\bgerbils?\b', '\bguinea pigs?\b']
  other:
    label: "Other"
    mult: 1.0
    patterns: ['\bferrets?\b', 'zebra finch', '\bsongbirds?\b', '\bbats?\b', '\bcats?\b', '\bowls?\b', '\bzebrafish\b', '\bdrosophila\b']

# ---------------------------------------------------------------------------
# METHODS — tagged for filtering; bonus is added before the species multiplier.
# ---------------------------------------------------------------------------
methods:
  single_unit:
    label: "Single units"
    bonus: 2.0
    patterns: ['single[- ](unit|neuron|cell)s?', '\bspik(e|es|ing)\b', 'firing rates?', 'neuropixels', 'utah array', 'multi-?unit', '\bMUA\b', 'extracellular(ly)? record', 'tetrodes?', 'neuronal (population|ensemble|activity|responses)', 'population (coding|dynamics|activity)', 'single neurons?']
  lfp:
    label: "LFP"
    bonus: 2.0
    patterns: ['local field potentials?', '\bLFPs?\b', 'current source density', '\bCSD\b', 'laminar (recording|profile|probe)', 'field potentials?']
  fmri:
    label: "fMRI"
    bonus: 2.0
    patterns: ['\bfMRI\b', 'functional (MRI|magnetic resonance)', '\bBOLD\b', 'resting[- ]state', '\bvoxel']
  intracranial:
    label: "Intracranial (ECoG/sEEG)"
    bonus: 1.5
    patterns: ['\bECoG\b', 'electrocorticograph', 'intracranial', 'stereo-?EEG|\bsEEG\b', '\biEEG\b', 'depth electrodes?']
  eeg_meg:
    label: "EEG/MEG"
    bonus: 1.0
    patterns: ['\bEEG\b', 'electroencephalogra', '\bMEG\b', 'magnetoencephalogra', '\bERPs?\b', 'event[- ]related potentials?']
  imaging:
    label: "Calcium imaging"
    bonus: 0.5
    patterns: ['calcium imaging', 'two[- ]photon', '2-photon', '\bGCaMP', 'fib(er|re) photometry', 'wide-?field imaging']
  perturbation:
    label: "Perturbation"
    bonus: 0.5
    patterns: ['microstimulation', '\bTMS\b', 'transcranial magnetic', '\btDCS\b', '\bt[AR]CS\b', 'focused ultrasound', '\blesion', 'inactivation', 'muscimol', '\bcooling\b']
  modelling:
    label: "Modelling"
    bonus: 0.5
    patterns: ['computational model', 'neural network model', '\bRNNs?\b', 'recurrent neural network', 'deep (neural )?network', 'bayesian (observer|model|inference)', 'drift[- ]diffusion', 'normative model']
