   name: Update digest

   on:
     schedule:
       - cron: "17 5 * * *"     # daily, 05:17 UTC
     workflow_dispatch:          # adds the "Run workflow" button
     push:
       paths: ["config.yaml", "template.html", "trawl.py"]

   permissions:
     contents: write

   concurrency:
     group: radar
     cancel-in-progress: false

   jobs:
     update:
       runs-on: ubuntu-latest
       timeout-minutes: 30
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
             cache: pip
         - run: pip install -r requirements.txt
         - name: Trawl sources and build site
           run: python trawl.py
         - name: Commit updated archive and site
           run: |
             git config user.name  "paper-radar-bot"
             git config user.email "paper-radar-bot@users.noreply.github.com"
             git add data/archive.json docs/index.html
             git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
             git push
