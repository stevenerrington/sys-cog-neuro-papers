# ---------------------------------------------------------------------------
# Paper Radar configuration
# Edit this file to change what gets pulled in and how it is ranked.
# Patterns are Python regular expressions, matched case-insensitively against
# the title and abstract. Every edit takes effect on the next daily run, and
# the whole archive is re-scored, so changes apply retroactively.
# ---------------------------------------------------------------------------

site:
  title: "Systems & Cognitive Neuro Digest"
  subtitle: "New papers on audition, prediction, memory and sequences"
  window_days: 30          # rolling window shown on the site
  min_score: 3.0           # papers scoring below this are dropped

sources:
  biorxiv:
    enabled: true
    categories: ["neuroscience", "animal_behavior_and_cognition"]
    new_only: true         # true = only version-1 postings (skip revisions)
  europepmc:
    enabled: true          # Europe PMC mirrors PubMed (all journals) + preprint servers
    include_preprints: true   # medRxiv, PsyArXiv, Research Square etc. (bioRxiv duplicates are merged)
    max_per_topic: 3000
    # Every Europe PMC query is ANDed with this so generic terms
    # (e.g. "memory", "sequence") stay inside neuroscience.
    context: 'neuron* OR neural OR brain OR cortex OR cortical OR hippocamp* OR electrophysiolog* OR fMRI OR EEG OR MEG OR "event-related" OR auditory OR perception OR cognition OR cognitive'

  crossref:
    enabled: true          # for listed journals marked `crossref: true` (not indexed in PubMed/Europe PMC)
    mailto: ""             # optional: your email, puts requests in Crossref's faster "polite" pool

# ---------------------------------------------------------------------------
# JOURNALS
#   mode: only  -> journal articles are kept only if the journal is listed below
#                  (preprints are always kept)
#         all   -> keep every journal Europe PMC returns; listed ones get `boost`
#   Matching is on the journal's full title or abbreviation, ignoring case,
#   punctuation and "The"/subtitles, so "Cerebral cortex (New York, N.Y. : 1991)"
#   matches "Cerebral Cortex". Unmatched journal names are printed in the
#   Action log so you can spot anything worth adding.
#   crossref: true  -> also fetched from Crossref (journal isn't in PubMed).
#                      Crossref often lacks abstracts, so these rank on titles.
# ---------------------------------------------------------------------------
journals:
  mode: only
  boost: 1.0
  groups:
    flagship:
      label: "Flagship & broad"
      list:
        - {name: "Nature Neuroscience", abbr: "Nat Neurosci"}
        - {name: "Neuron", abbr: "Neuron"}
        - {name: "Nature", abbr: "Nature"}
        - {name: "Science", abbr: "Science"}
        - {name: "Cell", abbr: "Cell"}
        - {name: "Nature Communications", abbr: "Nat Commun"}
        - {name: "PNAS", full: "Proceedings of the National Academy of Sciences of the United States of America", abbr: "Proc Natl Acad Sci U S A"}
        - {name: "Current Biology", abbr: "Curr Biol"}
        - {name: "eLife", abbr: "Elife"}
        - {name: "Science Advances", abbr: "Sci Adv"}
        - {name: "Nature Human Behaviour", abbr: "Nat Hum Behav"}
        - {name: "Cell Reports", abbr: "Cell Rep"}
    reviews:
      label: "Reviews & opinion"
      list:
        - {name: "Trends in Cognitive Sciences", abbr: "Trends Cogn Sci"}
        - {name: "Nature Reviews Neuroscience", abbr: "Nat Rev Neurosci"}
