name: Update digest

on:
  schedule:
    - cron: "17 5 * * *"     # daily, 05:17 UTC
  workflow_dispatch:          # adds the "Run workflow" button
  push:
    paths: ["config.yaml", "template.html", "trawl.py", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Trawl sources and build site
        run: python trawl.py
      - name: Commit updated archive and site
        run: |
          git config user.name  "paper-radar-bot"
          git config user.email "paper-radar-bot@users.noreply.github.com"
          git add data/archive.json docs/index.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily update $(date -u +%F)"
          # Someone may have pushed (e.g. a README edit) while the trawl ran:
          # rebase onto the latest main before pushing, with a few retries.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
